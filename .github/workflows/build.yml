name: Build ModStore Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optional disk cleanup
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport"
          xcrun simctl delete unavailable || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Build ModStore (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild -project "ModStore.xcodeproj" \
            -scheme "ModStore" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -derivedDataPath "build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/modstore-unsigned"
          APP_PATH="build/Build/Products/Release-iphoneos/ModStore.app"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR/Payload"
          cp -R "$APP_PATH" "$WORK_DIR/Payload/"

          (
            cd "$WORK_DIR"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Payload" "ModStore-Unsigned.ipa"
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ModStore-Unsigned
          path: ${{ runner.temp }}/modstore-unsigned/ModStore-Unsigned.ipa
