name: Build ModStore Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optional disk cleanup
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport"
          xcrun simctl delete unavailable || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Build ModStore (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild -project "ModStore.xcodeproj" \
            -scheme "ModStore" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -derivedDataPath "build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/modstore-unsigned"
          APP_PATH="build/Build/Products/Release-iphoneos/ModStore.app"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR/Payload"
          cp -R "$APP_PATH" "$WORK_DIR/Payload/"

          (
            cd "$WORK_DIR"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Payload" "ModStore-Unsigned.ipa"
          )

      - name: Publish direct .ipa to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA_FILE="$RUNNER_TEMP/modstore-unsigned/ModStore-Unsigned.ipa"

          # Create the 'latest' release if it doesn't exist yet, then overwrite the .ipa asset
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest "$IPA_FILE" \
              --title "Latest ModStore Build" \
              --notes "Automated unsigned IPA build from commit ${{ github.sha }}"
          else
            gh release upload latest "$IPA_FILE" --clobber
            gh release edit latest \
              --notes "Automated unsigned IPA build from commit ${{ github.sha }}"
          fi